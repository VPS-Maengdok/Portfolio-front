services:
  nextjs-app:
    image: maengdok/portfolio_front:1.0.0
    container_name: maengdok_portfolio_front
    restart: always
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    environment:
      - NODE_ENV=production
    networks:
      - proxy
      - portfolio
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.portfolio-front.rule=Host(`maengdok.fr`)"
      - "traefik.http.routers.portfolio-front.entrypoints=websecure"
      - "traefik.http.services.portfolio-front.loadbalancer.server.port=3000"
    # TLS certificate and secure-headers come from the websecure entrypoint (P0.3)
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    name: proxy
    external: true
  portfolio:
    name: portfolio
    external: true
