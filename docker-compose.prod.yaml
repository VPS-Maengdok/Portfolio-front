# Fixed project name: without it Compose uses the folder name, and ~/portfolio/back
# and ~/reader/back would both be project "back" (orphan warnings, and
# --remove-orphans would delete the other stack's container).
name: portfolio-front

services:
  nextjs-app:
    # Built and pushed by the release workflow (NEXT_PUBLIC_BACK_END_URL is passed
    # there as a build argument), never built on the server. IMAGE_TAG is the
    # sha-<commit> tag being deployed; "latest" is never deployed.
    image: ghcr.io/vps-maengdok/portfolio-front:${IMAGE_TAG:?set IMAGE_TAG to the image tag to deploy}
    container_name: maengdok_portfolio_front
    restart: always
    environment:
      - NODE_ENV=production
    # proxy only: the front never calls the back server-side (the browser calls
    # the public API URL), so a compromised front can't reach the back or Postgres.
    # P2.2 (server-side calls) will add a dedicated network holding only front + back.
    networks:
      - proxy
    # No env_file: the app needs no runtime variable (NEXT_PUBLIC_* is inlined at
    # build time), so nothing from .env reaches this Internet-facing container.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.portfolio-front.rule=Host(`maengdok.fr`)"
      - "traefik.http.routers.portfolio-front.entrypoints=websecure"
      - "traefik.http.services.portfolio-front.loadbalancer.server.port=3000"
    # TLS certificate and secure-headers come from the websecure entrypoint (P0.3)
    mem_limit: 512m
    pids_limit: 200
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      # Next.js runtime cache (the only writable path under /app)
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    name: proxy
    external: true
